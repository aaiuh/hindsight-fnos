<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hindsight 记忆库</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 30% -10%, #123b3a 0%, #0b1a1c 45%, #070d10 100%);
    color: #e8f1f0; padding: 24px;
  }
  .card {
    width: min(560px, 100%); padding: 32px 30px; border-radius: 22px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: .2px; }
  .sub { margin: 0 0 22px; font-size: 13px; color: #93aaa8; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  a.btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 38px; padding: 0 18px; border-radius: 19px;
    background: #2f8f86; color: #fff; text-decoration: none;
    font-size: 14px; font-weight: 500;
  }
  a.btn:hover { background: #37a399; }
  .state { font-size: 13px; color: #93aaa8; }
  .state b { color: #6fd0c4; font-weight: 600; }
  ul { margin: 20px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.9; color: #b9cdcb; }
  code { background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 6px; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Hindsight 记忆库</h1>
    <p class="sub">Agent 长期记忆系统 · 飞牛原生版</p>
    <div class="row">
      <a class="btn" id="docs" href="backend/docs" target="_blank" rel="noopener">打开接口文档</a>
      <span class="state" id="state">检查服务…</span>
    </div>
    <ul>
      <li>要真正抽取记忆，需要在 <code>hindsight.env</code> 里配置一个 OpenAI 兼容的大模型地址</li>
      <li>修改配置后在本应用上点「停止」再「启动」生效</li>
      <li>各个 profile 通过 <code>127.0.0.1:8888</code> 直接读写，不受此页面影响</li>
    </ul>
  </div>
  <script>
    (function () {
      var btn = document.getElementById('docs');
      var st = document.getElementById('state');
      fetch('info.json', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (info) {
          st.innerHTML = info.api_ok ? '服务状态 <b>正常</b>' : '服务状态 <b>异常</b>';
          if (!info.api_ok) { btn.removeAttribute('href'); }
        })
        .catch(function () { st.textContent = '状态未知'; });
    })();
  </script>
</body>
</html>
