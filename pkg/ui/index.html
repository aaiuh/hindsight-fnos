<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hindsight 记忆库</title>
<style>
  :root{
    color-scheme: light;
    --bg:#eef2f2; --ink:#16211f; --ink-2:#5c6f6c; --ink-3:#8b9c99;
    --line:rgba(22,33,31,.08); --glass:rgba(255,255,255,.66);
    --accent:#2f8f86; --chip:rgba(47,143,134,.10);
    --shadow:0 18px 50px rgba(16,40,38,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink); font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(900px 520px at 12% -8%, #d8ece9 0%, rgba(216,236,233,0) 60%),
      radial-gradient(760px 460px at 96% 4%, #e3eef6 0%, rgba(227,238,246,0) 55%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1080px;margin:0 auto;padding:26px 22px 60px}

  header{display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;letter-spacing:.2px}
  .brand .mark{
    width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(160deg,var(--accent),#1f6f68);color:#fff;
  }
  .spacer{flex:1}
  .status{
    display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:15px;
    background:var(--glass);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#c8d3d1}
  .dot.ok{background:#35b37f}
  .dot.bad{background:#e0664f}
  .icon-btn{
    width:34px;height:34px;border-radius:17px;display:grid;place-items:center;cursor:pointer;
    background:var(--glass);border:1px solid var(--line);color:var(--ink-2);text-decoration:none;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transition:transform .16s ease,color .16s ease;
  }
  .icon-btn:hover{color:var(--accent);transform:translateY(-1px)}
  .icon-btn:active{transform:translateY(0)}

  .glass{
    background:var(--glass);border:1px solid var(--line);border-radius:18px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);
  }
  .banks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .bank{
    display:flex;align-items:center;gap:8px;height:36px;padding:0 15px;border-radius:18px;cursor:pointer;
    background:rgba(255,255,255,.5);border:1px solid var(--line);color:var(--ink-2);
    font-size:13.5px;transition:all .16s ease;
  }
  .bank:hover{background:#fff;color:var(--ink)}
  .bank.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(47,143,134,.28)}
  .bank .count{font-variant-numeric:tabular-nums;opacity:.72;font-size:12.5px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .stat{padding:16px 18px}
  .stat .k{font-size:12.5px;color:var(--ink-3);margin-bottom:8px}
  .stat .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.2px}
  .stat .v.small{font-size:14px;font-weight:500;color:var(--ink-2);padding-top:7px}

  .searchbar{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;margin-bottom:14px}
  .searchbar .sicon{color:var(--ink-3);display:grid;place-items:center}
  .searchbar input{
    flex:1;border:0;outline:0;background:transparent;font-size:14.5px;color:var(--ink);
    height:34px;font-family:inherit;
  }
  .searchbar input::placeholder{color:var(--ink-3)}
  .searchbar .hint{font-size:12.5px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
  .clear{width:26px;height:26px;border-radius:13px;display:none;place-items:center;cursor:pointer;color:var(--ink-3)}
  .clear:hover{background:rgba(22,33,31,.06);color:var(--ink)}
  .clear.show{display:grid}

  .list{overflow:hidden}
  .row{
    display:flex;gap:14px;padding:16px 20px;cursor:pointer;border-bottom:1px solid var(--line);
    transition:background .14s ease;
  }
  .row:last-child{border-bottom:0}
  .row:hover{background:rgba(255,255,255,.62)}
  .row .body{flex:1;min-width:0}
  .row .text{
    font-size:14px;line-height:1.62;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-word;
  }
  .row .meta{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
  .tag{display:inline-flex;align-items:center;height:20px;padding:0 9px;border-radius:10px;
       background:var(--chip);color:#266e67;font-size:11.5px}
  .row .go{color:var(--ink-3);display:grid;place-items:center;align-self:center}
  .empty{padding:52px 20px;text-align:center;color:var(--ink-3);font-size:13.5px}

  .pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px}
  .pager .page-info{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .pager .icon-btn[disabled]{opacity:.35;cursor:default;transform:none}

  .mask{
    position:fixed;inset:0;background:rgba(12,24,22,.32);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;padding:24px;z-index:40;
  }
  .mask.show{display:flex}
  .dialog{
    width:min(720px,100%);max-height:82vh;display:flex;flex-direction:column;
    background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 30px 80px rgba(10,30,28,.28);overflow:hidden;
  }
  .dialog header{display:flex;align-items:center;gap:12px;padding:16px 18px 14px;margin:0;border-bottom:1px solid var(--line)}
  .dialog header .t{font-size:14.5px;font-weight:600}
  .dialog .content{padding:18px;overflow:auto}
  .dialog .content p{margin:0;font-size:13.5px;line-height:1.78;white-space:pre-wrap;word-break:break-word}
  .kv{margin-top:16px;display:grid;grid-template-columns:88px 1fr;gap:9px 14px;font-size:12.5px}
  .kv .k{color:var(--ink-3)}
  .kv .v{color:var(--ink-2);word-break:break-all}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,12px);opacity:0;pointer-events:none;
    background:rgba(22,33,31,.88);color:#fff;font-size:13px;padding:10px 16px;border-radius:19px;
    transition:all .2s ease;z-index:60;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:720px){
    .app{padding:18px 14px 48px}
    .stats{grid-template-columns:1fr;gap:10px}
    .stat{padding:14px 16px}
    .row{padding:14px 16px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
      </span>
      Hindsight
    </div>
    <div class="spacer"></div>
    <span class="status"><span class="dot" id="dot"></span><span id="statusText">连接中</span></span>
    <button class="icon-btn" id="refresh" title="刷新">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
    </button>
    <a class="icon-btn" id="docsLink" href="backend/docs" target="_blank" rel="noopener" title="接口文档">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </a>
  </header>

  <div class="banks" id="banks"></div>

  <div class="stats">
    <div class="glass stat"><div class="k">记忆条数</div><div class="v" id="statFacts">—</div></div>
    <div class="glass stat"><div class="k">检索结果</div><div class="v" id="statHits">—</div></div>
    <div class="glass stat"><div class="k">最近写入</div><div class="v small" id="statLast">—</div></div>
  </div>

  <div class="glass searchbar">
    <span class="sicon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    </span>
    <input id="q" type="search" placeholder="搜索记忆内容" autocomplete="off" spellcheck="false">
    <span class="clear" id="clear">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </span>
    <span class="hint" id="hint"></span>
  </div>

  <div class="glass list" id="list"></div>

  <div class="pager">
    <button class="icon-btn" id="prev" title="上一页">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span class="page-info" id="pageInfo">—</span>
    <button class="icon-btn" id="next" title="下一页">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog">
    <header>
      <span class="t">记忆详情</span>
      <div class="spacer"></div>
      <button class="icon-btn" id="copy" title="复制内容">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button>
      <button class="icon-btn" id="close" title="关闭">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="content">
      <p id="dText"></p>
      <div class="kv" id="dMeta"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var PAGE = 50;
  var TYPES = { world: '世界事实', experience: '经历', observation: '观察' };
  var state = { bank: '', q: '', page: 0, total: 0, banks: [] };
  var $ = function (id) { return document.getElementById(id); };

  function api(path) {
    return fetch(path, { cache: 'no-store' }).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok || (d && d.ok === false)) throw new Error((d && d.error) || ('HTTP ' + r.status));
        return d;
      });
    });
  }
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }
  function fmtNum(n) { return (n === null || n === undefined) ? '—' : Number(n).toLocaleString('zh-CN'); }
  function fmtTime(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    var p = function (x) { return x < 10 ? '0' + x : '' + x; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function shortTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var p = function (x) { return x < 10 ? '0' + x : '' + x; };
    return p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function renderBanks() {
    var box = $('banks');
    box.innerHTML = '';
    state.banks.forEach(function (b) {
      var el = document.createElement('div');
      el.className = 'bank' + (b.id === state.bank ? ' active' : '');
      var name = document.createElement('span');
      name.textContent = b.name;
      var cnt = document.createElement('span');
      cnt.className = 'count';
      cnt.textContent = fmtNum(b.facts);
      el.appendChild(name);
      el.appendChild(cnt);
      el.addEventListener('click', function () {
        if (state.bank === b.id) return;
        state.bank = b.id;
        state.page = 0;
        state.q = '';
        $('q').value = '';
        $('clear').classList.remove('show');
        $('hint').textContent = '';
        renderBanks();
        updateStats();
        loadList();
      });
      box.appendChild(el);
    });
  }
  function currentBank() {
    for (var i = 0; i < state.banks.length; i++) if (state.banks[i].id === state.bank) return state.banks[i];
    return null;
  }
  function updateStats() {
    var b = currentBank();
    $('statFacts').textContent = b ? fmtNum(b.facts) : '—';
    $('statLast').textContent = b ? fmtTime(b.last_write) : '—';
  }

  function renderRows(items) {
    var list = $('list');
    if (!items.length) { list.innerHTML = '<div class="empty">没有匹配的记忆</div>'; return; }
    list.innerHTML = '';
    items.forEach(function (m) {
      var row = document.createElement('div');
      row.className = 'row';
      var body = document.createElement('div');
      body.className = 'body';
      var text = document.createElement('div');
      text.className = 'text';
      text.textContent = m.text || '';
      var meta = document.createElement('div');
      meta.className = 'meta';
      var t = document.createElement('span');
      t.className = 'tag';
      t.textContent = TYPES[m.fact_type] || m.fact_type || '记忆';
      meta.appendChild(t);
      var d = document.createElement('span');
      d.textContent = shortTime(m.date);
      meta.appendChild(d);
      if (m.entities && m.entities.length) {
        var e = document.createElement('span');
        e.textContent = '实体 ' + m.entities.length;
        meta.appendChild(e);
      }
      body.appendChild(text);
      body.appendChild(meta);
      var go = document.createElement('div');
      go.className = 'go';
      go.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
      row.appendChild(body);
      row.appendChild(go);
      row.addEventListener('click', function () { openMemory(m); });
      list.appendChild(row);
    });
  }

  function openMemory(m) {
    $('dText').textContent = m.text || '';
    var meta = $('dMeta');
    meta.innerHTML = '';
    [['类型', TYPES[m.fact_type] || m.fact_type || '—'],
     ['时间', fmtTime(m.date)],
     ['文档', m.document_id || '—'],
     ['实体', (m.entities && m.entities.length) ? m.entities.slice(0, 12).join('、') : '—'],
     ['标识', m.id || '—']
    ].forEach(function (r) {
      var k = document.createElement('div');
      k.className = 'k';
      k.textContent = r[0];
      var v = document.createElement('div');
      v.className = 'v';
      v.textContent = r[1];
      meta.appendChild(k);
      meta.appendChild(v);
    });
    $('mask').classList.add('show');
    $('copy').onclick = function () {
      var txt = m.text || '';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () { toast('已复制'); },
          function () { toast('复制失败'); });
      } else { toast('浏览器不支持复制'); }
    };
  }

  function loadList() {
    if (!state.bank) return;
    $('list').innerHTML = '<div class="empty">加载中…</div>';
    var url = 'api/memories?bank=' + encodeURIComponent(state.bank) + '&limit=' + PAGE + '&offset=' + (state.page * PAGE);
    if (state.q) url += '&q=' + encodeURIComponent(state.q);
    api(url).then(function (d) {
      state.total = d.total || 0;
      renderRows(d.items || []);
      $('statHits').textContent = fmtNum(state.total);
      $('hint').textContent = state.q ? ('匹配 ' + fmtNum(state.total)) : '';
      var pages = Math.max(1, Math.ceil(state.total / PAGE));
      $('pageInfo').textContent = state.total ? ((state.page + 1) + ' / ' + pages) : '—';
      $('prev').disabled = state.page <= 0;
      $('next').disabled = (state.page + 1) >= pages;
    }).catch(function (e) {
      $('list').innerHTML = '<div class="empty">加载失败：' + e.message + '</div>';
    });
  }

  function loadOverview() {
    return api('api/overview').then(function (d) {
      state.banks = d.banks || [];
      if (!state.banks.length) throw new Error('没有可用的记忆库');
      var keep = state.bank;
      var found = state.banks.some(function (b) { return b.id === keep; });
      state.bank = found ? keep : state.banks[0].id;
      renderBanks();
      updateStats();
      loadList();
      $('dot').className = 'dot ok';
      $('statusText').textContent = '服务正常';
    }).catch(function (e) {
      $('dot').className = 'dot bad';
      $('statusText').textContent = '服务异常';
      $('list').innerHTML = '<div class="empty">' + e.message + '</div>';
    });
  }

  var timer = null;
  $('q').addEventListener('input', function () {
    var v = this.value.trim();
    $('clear').classList.toggle('show', v.length > 0);
    clearTimeout(timer);
    timer = setTimeout(function () { state.q = v; state.page = 0; loadList(); }, 260);
  });
  $('clear').addEventListener('click', function () {
    $('q').value = '';
    this.classList.remove('show');
    state.q = '';
    state.page = 0;
    $('hint').textContent = '';
    loadList();
  });
  $('refresh').addEventListener('click', function () { loadOverview(); toast('已刷新'); });
  $('prev').addEventListener('click', function () { if (state.page > 0) { state.page -= 1; loadList(); } });
  $('next').addEventListener('click', function () { state.page += 1; loadList(); });
  $('close').addEventListener('click', function () { $('mask').classList.remove('show'); });
  $('mask').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('show'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('mask').classList.remove('show'); });

  (function () {
    var p = location.pathname;
    var base = p.replace(/[^/]*$/, '');
    if (!/\/$/.test(base)) base += '/';
    $('docsLink').href = base + 'backend/docs';
  })();

  loadOverview();
})();
</script>
</body>
</html>
